# 排課計算：Google 試算表按「開始排課」→ 觸發這裡 → 排好後把結果送回試算表
# 不用手動操作；也可以在 GitHub 的 Actions 頁面按「Run workflow」手動重跑
name: 排課計算

on:
  repository_dispatch:
    types: [schedule]
  workflow_dispatch:

concurrency:
  group: schedule
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 排課並送回試算表
        env:
          SCHED_URL: ${{ secrets.SCHED_URL }}
          SCHED_KEY: ${{ secrets.SCHED_KEY }}
        run: python engine/run_remote.py
